fail_fast: true
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        description: "Run 'ruff format'."
        entry: uv run ruff format --force-exclude
        language: python
        types_or: [python, pyi, jupyter]
        require_serial: true

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --force-exclude --fix
        language: python
        types_or: [python, pyi]
        require_serial: true

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint-fix
        args: ["--disable", "MD046", "MD013", "MD033", "--"]

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: python
        types: [python]
        require_serial: true
