[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{email = "eng@cradle.bio", name = "Cradle"}]
description = "A template for a simple Cradle custom predictor"
name = "custom-predictor-template"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "1.0.0"

[project.scripts]
server = "predictor.entrypoints.serve:serve"

[tool.hatch.build]
packages = ["predictor"]
