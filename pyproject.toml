[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [{email = "eng@cradle.bio", name = "Cradle"}]
description = "A template for a simple Cradle custom predictor"
name = "custom-predictor-template"
readme = "README.md"
requires-python = ">=3.12,<3.13"
version = "1.0.0"

[tool.uv]
dev-dependencies = [
    "ruff>=0.11.4",
    "pyright>=1.1.402",
    "pre-commit",
]

[project.scripts]
server = "predictor.entrypoints.serve:serve"

[tool.hatch.build]
packages = ["predictor"]

[tool.ruff]
line-length = 120
